<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twitter Defang</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fff; --fg:#0f1419; --muted:#536471; --line:#eff3f4;
    --accent:#1d9bf0; --chip:#f7f9f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#e7e9ea; --muted:#71767b; --line:#2f3336; --chip:#16181c; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); width:380px; max-width:100%;
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  /* Same page serves as popup (380px) and as a full options tab. */
  @media (min-width: 700px) { body { width:auto; } main { max-width:620px; margin:0 auto; padding:32px 24px; } }
  main { padding:18px 16px 22px; }
  header { margin-bottom:16px; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:-0.01em; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  h2 {
    font-size:11px; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--muted); margin:22px 0 8px; font-weight:700;
  }
  .item {
    display:flex; align-items:flex-start; gap:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:12px; margin-bottom:8px;
    background:var(--chip);
  }
  .item label { flex:1; cursor:pointer; }
  .item .name { display:block; font-weight:600; }
  .item .desc { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
  input[type=checkbox] { width:18px; height:18px; margin-top:2px; accent-color:var(--accent); cursor:pointer; flex:none; }
  footer { margin-top:20px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line); padding-top:14px; }
  #saved { color:var(--accent); font-weight:600; opacity:0; transition:opacity .2s; }
  #saved.on { opacity:1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Twitter Defang</h1>
    <p>Individual posts and their replies stay. Everything built to keep you scrolling goes.</p>
  </header>

  <h2>Pages you can still reach</h2>
  <div id="routes"></div>

  <h2>What gets stripped from a post</h2>
  <div id="strip"></div>

  <footer>Changes apply immediately. <span id="saved">Saved</span></footer>
</main>
<script src="rules.js"></script>
<script src="options.js"></script>
</body>
</html>
