<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #0f1419; --muted: #536471;
    --line: #eff3f4; --accent: #1d9bf0; --chip: #f7f9f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#e7e9ea; --muted:#71767b; --line:#2f3336; --chip:#16181c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
    background: var(--chip); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 24px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 6px; color: var(--fg);
  }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 999px;
    padding: 9px 18px; border: 1px solid var(--line); background: var(--chip);
    color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.08); }
  .hint { margin-top: 22px; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">&#9210;</div>
    <h1 id="title">This is a feed, not a post</h1>
    <p id="detail">Twitter Defang only opens individual posts and their replies.</p>
    <p><code id="path"></code></p>
    <div class="row">
      <button class="primary" id="back">Go back</button>
      <button id="settings">Settings</button>
    </div>
    <p class="hint">Have a link to a specific post? It will still open normally.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
